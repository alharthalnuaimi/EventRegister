<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="منصة الحضور المباشر — قاعة بابل، جامعة الفارابي">
    <meta name="theme-color" content="#02040f">
    <title>منصة الحضور المباشر — جامعة الفارابي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --midnight: #02040f;
            --navy: #05082b;
            --navy-mid: #0d1245;
            --crimson: #8b0000;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --ivory: #f5f0e8;
            --ivory-dim: rgba(245, 240, 232, 0.65);
            --glass: rgba(13, 18, 69, 0.55);
            --glass-border: rgba(201, 168, 76, 0.22);
            --font-heading: 'Syne', 'IBM Plex Sans Arabic', sans-serif;
            --font-body: 'IBM Plex Sans Arabic', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--midnight);
            color: var(--ivory);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(201, 168, 76, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(139, 0, 0, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .display-shell {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .crest-header {
            margin-bottom: 16px;
        }

        .crest-header img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            border-radius: 50%;
            padding: 4px;
            background: radial-gradient(circle, var(--navy-mid) 0%, var(--midnight) 100%);
            border: 1.5px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(201, 168, 76, 0.25);
        }

        .brand-subtitle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 16px;
            background: rgba(245, 240, 232, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            font-size: 13px;
            color: var(--gold-light);
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .display-title {
            font-family: var(--font-heading);
            font-size: clamp(26px, 4.5vw, 48px);
            font-weight: 800;
            color: var(--ivory);
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .display-title span {
            background: linear-gradient(135deg, var(--ivory) 20%, var(--gold-light) 60%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .speaker-credit {
            font-size: clamp(15px, 2vw, 19px);
            color: var(--ivory-dim);
            margin-bottom: 22px;
        }

        .speaker-credit strong {
            color: var(--gold-light);
        }

        .venue-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 18px;
            background: rgba(13, 18, 69, 0.6);
            border: 1px solid rgba(201, 168, 76, 0.25);
            border-radius: 8px;
            font-size: 14px;
            color: var(--ivory-dim);
            margin-bottom: 26px;
        }

        .qr-frame {
            background: #FFFFFF;
            padding: 18px;
            border-radius: 20px;
            border: 3px solid var(--gold);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(201, 168, 76, 0.2);
            margin-bottom: 22px;
            display: inline-block;
        }

        #qr-canvas {
            display: block;
            width: 280px;
            height: 280px;
        }

        @media (min-width: 768px) {
            #qr-canvas { width: 340px; height: 340px; }
        }

        @media (min-width: 1400px) {
            #qr-canvas { width: 400px; height: 400px; }
        }

        .instruction-line {
            font-size: 16px;
            color: var(--ivory);
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Live Counter Ribbon */
        .counter-strip {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 12px 32px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 28px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 12px #10B981;
            animation: pulse-dot 2s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .counter-label {
            font-size: 15px;
            color: var(--ivory-dim);
            font-weight: 500;
        }

        .counter-digits {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 800;
            color: var(--gold-light);
            letter-spacing: 0.05em;
        }

        .export-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-exp {
            background: transparent;
            border: 1px solid rgba(245, 240, 232, 0.15);
            color: var(--ivory-dim);
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-exp:hover {
            border-color: var(--gold);
            color: var(--ivory);
            background: rgba(201, 168, 76, 0.08);
        }

        @media print {
            .export-links, .counter-strip { display: none; }
            body { background: #FFFFFF; color: #000000; }
        }
    </style>
</head>
<body>

    <div class="display-shell">
        <div class="crest-header">
            <img src="logo.jpg" alt="Al Farabi University Crest">
        </div>

        <div class="brand-subtitle">جامعة الفارابي • قسم هندسة الذكاء الاصطناعي</div>

        <h1 class="display-title" id="display-title">
            <span>AI Is Not As We Know It</span>
        </h1>

        <p class="speaker-credit">المحاضر: <strong>البروفيسور الدكتور ضياء الجميلي</strong> (جامعة ليفربول جون مورس)</p>

        <div class="venue-chip">
            <span>قاعة بابل</span>
            <span>—</span>
            <span>الاثنين 2026/11/2 • 10:00 صباحاً</span>
        </div>

        <div class="qr-frame">
            <canvas id="qr-canvas"></canvas>
        </div>

        <p class="instruction-line">امسح الرمز بكاميرا هاتفك لتأكيد الحضور الرسمي</p>

        <div class="counter-strip">
            <span class="status-dot"></span>
            <span class="counter-label">إجمالي الحضور المسجل:</span>
            <span class="counter-digits" id="counter-number">0</span>
        </div>

        <div class="export-links">
            <button class="btn-exp" onclick="exportQR('png')">تصدير الرمز كصورة PNG</button>
            <button class="btn-exp" onclick="exportQR('svg')">تصدير الرمز كمتجه SVG</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const SUPABASE_URL  = window.SUPABASE_URL || 'https://YOUR_PROJECT.supabase.co';
        const SUPABASE_ANON = window.SUPABASE_ANON || 'YOUR_ANON_KEY';
        const EVENT_SLUG = new URLSearchParams(window.location.search).get('event') || 'ai-lecture-2026';

        const basePath = window.location.pathname.replace(/(?:display\.html|display)$/i, '');
        const REGISTER_URL = window.location.origin + basePath + '?event=' + encodeURIComponent(EVENT_SLUG);

        const canvas = document.getElementById('qr-canvas');
        QRCode.toCanvas(canvas, REGISTER_URL, {
            width: canvas.clientWidth || 340,
            margin: 2,
            color: { dark: '#02040f', light: '#FFFFFF' },
            errorCorrectionLevel: 'H'
        }, function (err) {
            if (err) console.error('QR error:', err);
        });

        function exportQR(format) {
            if (format === 'png') {
                const link = document.createElement('a');
                link.download = `alfarabi-qr-${EVENT_SLUG}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } else if (format === 'svg') {
                QRCode.toString(REGISTER_URL, {
                    type: 'svg',
                    margin: 2,
                    color: { dark: '#02040f', light: '#FFFFFF' },
                    errorCorrectionLevel: 'H'
                }, function (err, svg) {
                    if (err) return console.error(err);
                    const blob = new Blob([svg], { type: 'image/svg+xml' });
                    const link = document.createElement('a');
                    link.download = `alfarabi-qr-${EVENT_SLUG}.svg`;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                });
            }
        }

        async function updateCounter() {
            try {
                if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_PROJECT')) {
                    const res = await fetch(`/api/events/${encodeURIComponent(EVENT_SLUG)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.event && typeof data.event.total_registrations !== 'undefined') {
                            document.getElementById('counter-number').textContent = data.event.total_registrations;
                            return;
                        }
                    }
                }

                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_event_display`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON,
                        'Authorization': `Bearer ${SUPABASE_ANON}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_event_slug: EVENT_SLUG })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data && typeof data.total_registrations !== 'undefined') {
                        document.getElementById('counter-number').textContent = data.total_registrations;
                    }
                }
            } catch (e) {}
        }

        updateCounter();
        setInterval(updateCounter, 6000);
    </script>
</body>
</html>
